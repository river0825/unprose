# Publish the project website (site/) to GitHub Pages on every push to main.
# Static files, no build and no npm install: plain node makes the release notes from CHANGELOG.md
# (scripts/site-release-notes.mjs → site/releases/, and the home pages' "What's new"), then the footer
# gets the version from package.json.
name: pages
on:
  push:
    branches: [main]
    paths: [site/**, CHANGELOG.md, package.json, scripts/site-release-notes.mjs, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # only the public repository has Pages
    if: github.repository == 'river0825/unprose'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: release notes from CHANGELOG.md
        run: node scripts/site-release-notes.mjs
      - name: stamp the version
        run: |
          set -euo pipefail
          v="$(node -p "require('./package.json').version")"
          for f in site/index.html site/zh-TW/index.html; do
            sed -i "s#<span data-version></span>#<span data-version> · v$v</span>#" "$f"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
