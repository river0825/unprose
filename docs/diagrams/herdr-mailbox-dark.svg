<svg viewBox="0 0 1280 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="herdr-mailbox-dark-title herdr-mailbox-dark-desc">
  <title id="herdr-mailbox-dark-title">A2A without A2A: an interactive agent in a herdr pane</title>
  <desc id="herdr-mailbox-dark-desc">Sequence showing the awd engine handing an AI step to the HerdrWorker adapter, which finds or starts an agent pane through herdr, writes the input mailbox file, submits one prompt line, then polls the answer file and the agent state until out.json is valid or the agent is blocked.</desc>
