<svg viewBox="0 0 1280 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="alignment-loop-title alignment-loop-desc">
  <title id="alignment-loop-title">Agent and human align on the canvas</title>
  <desc id="alignment-loop-desc">Sequence showing Claude Code drawing a board through the MCP server, waiting on the canvas long-poll while the person edits in the browser, the wait resolving after a quiet window or a handoff, and the agent replying with a comment that reaches the browser over the websocket.</desc>
