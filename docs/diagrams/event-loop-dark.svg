<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="event-loop-dark-title event-loop-dark-desc">
  <title id="event-loop-dark-title">One tick of the awd runtime</title>
  <desc id="event-loop-dark-desc">Data-flow loop: a trigger appends an event to the store, the pure reducer turns state and event into commands, four executors (script, AI worker, human wait, timer) act on them and append the resulting step outcome events back to the store.</desc>
  <defs>
    <marker id="event-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b7bcc3"/></marker>
    <marker id="event-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7ea2ff"/></marker>
    <marker id="event-loop-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8fb3e6"/></marker>
  </defs>
